apiVersion: apps/v1
kind: Deployment
metadata:
  name: kisan-backend
  namespace: kisan-production
  labels:
    app: kisan-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: kisan-backend
  template:
    metadata:
      labels:
        app: kisan-backend
    spec:
      containers:
      - name: backend
        image: ghcr.io/muhammad08-dot/kisan-backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: kisan-config
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
